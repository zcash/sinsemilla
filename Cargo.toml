[package]
name = "sinsemilla"
version = "0.1.0"
authors = [
    "Jack Grigg <jack@electriccoin.co>",
    "Kris Nuttycombe <kris@electriccoin.co>",
    "Ying Tong Lai",
]
edition = "2021"
rust-version = "1.88"
description = "A collision-resistant circuit-efficient hash function"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/sinsemilla"
categories = ["cryptography"]

# docs.rs builds with no features by default, which would document neither the `std`
# feature's tables nor the `test-dependencies` constructors. `--cfg docsrs` turns on the
# `doc_cfg` feature gate in `lib.rs`, so the items those features add are labelled with
# the feature that provides them.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
group = "0.14"
pasta_curves = { version = "0.5", default-features = false, features = ["alloc"] }
subtle = { version = "2.3", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rand = "0.10"

[features]
std = []
runtime-precomputation = ["std"]
test-dependencies = []

[[bench]]
name = "sinsemilla"
harness = false

[patch.crates-io]
pasta_curves = { git = "https://github.com/zcash/pasta_curves.git", rev = "0012effb451654173a3c82a8c58a8541ff255dc5" }
