[package]
name = "sinsemilla"
version = "0.2.1"
authors = [
    "Jack Grigg <jack@zodl.com>",
    "Kris Nuttycombe <kris@zodl.com>",
    "Ying Tong Lai",
]
edition = "2024"
rust-version = "1.88"
description = "A collision-resistant circuit-efficient hash function"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/sinsemilla"
categories = ["cryptography"]

# Include feature-gated APIs and label them with their required features.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
group = "0.14"
once_cell = { version = "1", optional = true, default-features = false, features = ["alloc"] }
pasta_curves = { version = "0.6", default-features = false, features = ["alloc"] }
subtle = { version = "2.3", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rand = "0.10"

[features]
std = []
precompute-tables = ["dep:once_cell"]
# Guarantee coverage of the Orchard Merkle hash, including its exceptional-case checks.
merkle-table = ["precompute-tables"]
test-dependencies = []

[[bench]]
name = "sinsemilla"
harness = false
