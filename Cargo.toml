[package]
name = "sinsemilla"
version = "0.1.0"
authors = [
    "Jack Grigg <jack@electriccoin.co>",
    "Kris Nuttycombe <kris@electriccoin.co>",
    "Ying Tong Lai",
]
edition = "2021"
rust-version = "1.88"
description = "A collision-resistant circuit-efficient hash function"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/sinsemilla"
categories = ["cryptography"]

[dependencies]
group = "0.14"
pasta_curves = { version = "0.5", default-features = false, features = ["alloc"] }
subtle = { version = "2.3", default-features = false }

[build-dependencies]
ff = { version = "0.14", default-features = false }
group = "0.14"
pasta_curves = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rand = "0.10"

[features]
test-dependencies = []

[[bench]]
name = "sinsemilla"
harness = false

[patch.crates-io]
# zcash/pasta_curves branch dw/from-xy-unchecked: the ff 0.14 support main
# already patches for, plus the `from_xy_unchecked` of
# https://github.com/zcash/pasta_curves/pull/116 that the affine constants need.
# Neither is in a release yet. Replace this with a version requirement once they
# are; this commit is the only thing to drop.
pasta_curves = { git = "https://github.com/zcash/pasta_curves.git", rev = "e44de5937eeb00d31d6792b669da57f39d59a1f2" }
