name: Stable lints

# We only run these lints on trial-merges of PRs to reduce noise.
on: pull_request

concurrency:
  # Cancel a superseded run of the same workflow on the same pull request; a
  # push to a branch or to main keeps running, so history stays complete.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  clippy:
    name: Clippy (MSRV) with ${{ matrix.features }}
    strategy:
      fail-fast: false
      matrix:
        # Each feature on its own as well as all together, so a `#[cfg]` that only
        # holds under one combination cannot pass unnoticed. The `--features=x`
        # spelling keeps each entry a single argument.
        features:
          - --no-default-features
          - --features=std
          - --features=precompute-tables
          - --features=test-dependencies
          - --all-features
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      checks: write # post Clippy annotations as a check run

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run clippy
        uses: auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317 # 1.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # cargo-level flags go in `check-args` (before the `--`); lint levels
          # go in `deny`/`warn` (the action places them after the `--`).
          check-args: ${{ matrix.features }} --all-targets
          deny: warnings

  # `Clippy (MSRV)` is a required check on `main`, and a matrix job reports one
  # check per entry instead, so this job carries the required name and passes
  # only when every entry did.
  clippy-required:
    name: Clippy (MSRV)
    needs: clippy
    # `always()` is load-bearing: without it this job is skipped when an entry
    # fails, and GitHub treats a skipped required check as satisfied.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine whether every feature set passed
        env:
          RESULT: ${{ needs.clippy.result }}
        run: test "$RESULT" = success
